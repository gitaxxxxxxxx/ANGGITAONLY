<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIMKAS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

    <div class="max-w-[360px] w-full bg-white rounded-2xl shadow-sm border border-slate-200/90 p-7 space-y-5">
        <!-- Logo & Header Minimalis -->
        <div class="text-center">
            <div class="w-10 h-10 bg-emerald-600 rounded-xl mx-auto flex items-center justify-center text-white shadow-sm mb-3">
                <i data-lucide="wallet" class="w-5 h-5"></i>
            </div>
            <h1 class="text-base font-bold text-slate-900 tracking-tight">SIMKAS ORMAWA</h1>
            <p class="text-xs text-slate-400 mt-0.5">Masuk untuk melanjutkan</p>
        </div>

        {% if messages %}
        <div class="space-y-2">
            {% for message in messages %}
            <div class="p-2.5 text-xs rounded-xl bg-rose-50 text-rose-700 border border-rose-200 flex items-center space-x-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-rose-500"></i>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Form Login Minimalis -->
        <form method="POST" class="space-y-3.5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Username</label>
                <input type="text" name="username" required autofocus placeholder="Username..." class="w-full px-3.5 py-2 bg-slate-50/50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all placeholder:text-slate-400">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="passwordInput" name="password" required placeholder="Password..." class="w-full pl-3.5 pr-10 py-2 bg-slate-50/50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all placeholder:text-slate-400">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                        <i id="eyeIcon" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl text-sm transition-colors shadow-sm mt-1">
                Masuk
            </button>
        </form>

        <div class="pt-2 text-center border-t border-slate-100">
            <p class="text-[11px] text-slate-400">Sistem Informasi Kas Kemahasiswaan</p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function togglePassword() {
            const pwd = document.getElementById('passwordInput');
            const eye = document.getElementById('eyeIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                eye.setAttribute('data-lucide', 'eye-off');
            } else {
                pwd.type = 'password';
                eye.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
