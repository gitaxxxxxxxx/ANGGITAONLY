<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ app_title }}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-emerald-900/40 p-8 space-y-6">
        <!-- Logo & Header -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-gradient-to-tr from-emerald-600 to-teal-500 rounded-2xl mx-auto flex items-center justify-center text-white shadow-lg shadow-emerald-500/30">
                <i data-lucide="wallet" class="w-7 h-7"></i>
            </div>
            <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">{{ app_title }}</h1>
            <p class="text-xs text-slate-500 leading-relaxed">
                Sistem Informasi Manajemen Kas Organisasi Kemahasiswaan Berbasis Web dengan Rekapitulasi Otomatis
            </p>
        </div>

        {% if messages %}
        <div class="space-y-2">
            {% for message in messages %}
            <div class="p-3 text-xs rounded-xl bg-rose-50 text-rose-800 border border-rose-200 flex items-center space-x-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Pilihan Role: Admin atau Anggota -->
        <div class="bg-slate-100 p-1.5 rounded-2xl grid grid-cols-2 gap-1 text-xs font-semibold">
            <button type="button" onclick="fillRole('admin', 'admin123')" id="btnAdmin" class="py-2.5 rounded-xl text-center transition-all bg-white text-emerald-800 shadow-sm font-bold flex items-center justify-center space-x-1.5">
                <i data-lucide="shield-check" class="w-4 h-4"></i>
                <span>Admin</span>
            </button>
            <button type="button" onclick="fillRole('anggota', 'anggota123')" id="btnAnggota" class="py-2.5 rounded-xl text-center transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-1.5">
                <i data-lucide="user" class="w-4 h-4"></i>
                <span>Anggota</span>
            </button>
        </div>

        <!-- Login Form -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </span>
                    <input type="text" name="username" id="usernameInput" required value="admin" placeholder="Masukkan username" class="w-full pl-10 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </span>
                    <input type="password" name="password" id="passwordInput" required value="admin123" placeholder="Masukkan password" class="w-full pl-10 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold rounded-xl text-sm shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center space-x-2">
                <span>Masuk</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- Akun Demo Sederhana -->
        <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-3.5 text-xs text-slate-600 space-y-1.5">
            <div class="flex justify-between items-center text-[11px]">
                <span class="font-semibold text-slate-700">Akun Admin:</span>
                <span class="font-mono bg-white px-2 py-0.5 rounded border border-slate-200 text-emerald-800 font-bold">admin / admin123</span>
            </div>
            <div class="flex justify-between items-center text-[11px]">
                <span class="font-semibold text-slate-700">Akun Anggota:</span>
                <span class="font-mono bg-white px-2 py-0.5 rounded border border-slate-200 text-slate-800 font-bold">anggota / anggota123</span>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function fillRole(role, pass) {
            const uInput = document.getElementById('usernameInput');
            const pInput = document.getElementById('passwordInput');
            const btnAdmin = document.getElementById('btnAdmin');
            const btnAnggota = document.getElementById('btnAnggota');

            uInput.value = role;
            pInput.value = pass;

            if (role === 'admin') {
                btnAdmin.className = "py-2.5 rounded-xl text-center transition-all bg-white text-emerald-800 shadow-sm font-bold flex items-center justify-center space-x-1.5";
                btnAnggota.className = "py-2.5 rounded-xl text-center transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-1.5";
            } else {
                btnAnggota.className = "py-2.5 rounded-xl text-center transition-all bg-white text-emerald-800 shadow-sm font-bold flex items-center justify-center space-x-1.5";
                btnAdmin.className = "py-2.5 rounded-xl text-center transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-1.5";
            }
        }
    </script>
</body>
</html>
